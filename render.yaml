services:
  - type: web
    name: autohub-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter dealership-inventory-api start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_FILE
        value: /var/data/inventory.db
    disk:
      name: autohub-data
      mountPath: /var/data
      sizeGB: 1
